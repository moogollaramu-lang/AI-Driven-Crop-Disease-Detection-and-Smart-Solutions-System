<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Driven Crop Disease Detection & Smart Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #10b981;
      --primary-hover: #059669;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
    }

    /* Container for Iframe */
    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Hidden until loaded */
    }

    /* Premium Loading Screen */
    .loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .leaf-loader {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }

    /* Leaf Animation */
    .leaf-loader::before {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      background-color: var(--primary-color);
      border-radius: 0 40px;
      animation: pulse 1.5s infinite ease-in-out alternate;
    }

    @keyframes pulse {
      0% {
        transform: rotate(45deg) scale(0.8);
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
      }
      100% {
        transform: rotate(45deg) scale(1.2);
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
      }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(to right, #10b981, #34d399, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Premium Button */
    .launch-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      font-weight: 600;
      border-radius: 50px;
      box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .launch-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -10px rgba(16, 185, 129, 0.6);
    }

    .fallback-info {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Premium Loader -->
    <div id="loader" class="loading-screen">
      <div class="leaf-loader"></div>
      <h1>AI-Driven Crop Disease System</h1>
      <p class="subtitle">Connecting to Smart Agriculture Platform...</p>
      
      <!-- Primary Action Button -->
      <a id="action-link" href="https://moogollaramu-cropapp.streamlit.app" target="_blank" class="launch-btn">
        Open Direct Platform
      </a>
      
      <div class="fallback-info">
        If the app does not load below in 5 seconds, click the button above to launch it directly.
      </div>
    </div>

    <!-- Embedded Streamlit Application -->
    <iframe 
      id="app-iframe" 
      src="https://moogollaramu-cropapp.streamlit.app" 
      allow="geolocation; camera; microphone"
      onload="onIframeLoad()">
    </iframe>
  </div>

  <script>
    // Configuration: Replace with your actual Streamlit URL once deployed
    // Example: "https://your-app-name.streamlit.app"
    const STREAMLIT_URL = "https://moogollaramu-cropapp.streamlit.app";

    const iframe = document.getElementById('app-iframe');
    const loader = document.getElementById('loader');
    const actionLink = document.getElementById('action-link');

    // Update links to point to the correct configured Streamlit URL
    iframe.src = STREAMLIT_URL;
    actionLink.href = STREAMLIT_URL;

    // Timeout fallback: if the iframe takes too long, fade out the loader slightly so the user can click
    setTimeout(() => {
      iframe.style.display = 'block';
    }, 3000);

    function onIframeLoad() {
      // Fade out loading screen smoothly
      loader.style.opacity = '0';
      iframe.style.display = 'block';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 800);
    }
  </script>
</body>
</html>
