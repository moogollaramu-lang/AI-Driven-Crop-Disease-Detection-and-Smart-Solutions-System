<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>local-back-camera-input</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./streamlit-component-lib.js"></script>
    <script src="./main.js"></script>
  </head>
  <body>    
    <div id="container">
      <div id="video-wrapper">
        <video id="video" autoplay="true" playsinline="true" muted="true"></video>
        <div id="live-badge"><span class="pulse-dot"></span>LIVE FEED ACTIVE</div>
        <div id="flash-effect"></div>
        <div id="capture-status">Photo Captured!</div>
      </div>
      <button id="capture-btn">Take Photo</button>
      <canvas id="canvas" style="display:none"></canvas>
    </div>    
  </body>
</html>
