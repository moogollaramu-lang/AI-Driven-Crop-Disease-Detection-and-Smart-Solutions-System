<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>local-back-camera-input</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./streamlit-component-lib.js"></script>
    <script src="./main.js"></script>
  </head>
  <body>    
    <div id="container">
      <video id="video" autoplay="true" playsinline="true" muted="true"></video>
      <img id="preview" style="display:none; width: 100%; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid rgba(255, 255, 255, 0.4);" />
      <button id="capture-btn">Take Photo</button>
      <canvas id="canvas" style="display:none"></canvas>
    </div>    
  </body>
</html>
